services:
  bot-dev:
    build: .
    container_name: tgbot-dev
    restart: unless-stopped
    env_file: .env.dev
    ports:
      - "8081:8080"
    depends_on:
      db-dev:
        condition: service_healthy

  db-dev:
    image: postgres:16-alpine
    container_name: postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: calbot_dev
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d calbot_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_dev:
