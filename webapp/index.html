<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Календарь</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--tg-theme-bg-color, #fff);
  color: var(--tg-theme-text-color, #000);
  min-height: 100vh;
}
.view { display: none; }
.view.active { display: block; }

/* List */
.list-header { padding: 20px 16px 8px; font-size: 20px; font-weight: 700; }
.seg-control {
  display: flex; margin: 0 12px 8px; border-radius: 10px; overflow: hidden;
  background: var(--tg-theme-secondary-bg-color, #f2f2f7);
}
.seg-btn {
  flex: 1; padding: 8px 0; border: none; background: none; font-size: 14px;
  color: var(--tg-theme-hint-color, #8e8e93); cursor: pointer; font-weight: 500;
  transition: background 0.15s, color 0.15s;
}
.seg-btn.active {
  background: var(--tg-theme-button-color, #2481cc);
  color: var(--tg-theme-button-text-color, #fff);
  border-radius: 8px;
}
.event-card {
  margin: 6px 12px;
  padding: 14px;
  border-radius: 14px;
  background: var(--tg-theme-secondary-bg-color, #f2f2f7);
  position: relative;
}
.event-title { font-size: 15px; font-weight: 600; padding-right: 32px; }
.event-meta { font-size: 13px; color: var(--tg-theme-hint-color, #8e8e93); margin-top: 4px; }
.del-btn {
  position: absolute; top: 12px; right: 12px;
  background: none; border: none; font-size: 18px; cursor: pointer; opacity: 0.45;
}
.del-btn:active { opacity: 1; }
.fab {
  position: fixed; bottom: 28px; right: 20px;
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--tg-theme-button-color, #2481cc);
  color: var(--tg-theme-button-text-color, #fff);
  font-size: 28px; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
}
.empty { text-align: center; padding: 64px 24px; color: var(--tg-theme-hint-color, #8e8e93); font-size: 15px; }
.empty-icon { font-size: 48px; margin-bottom: 12px; }

/* Form */
.form-wrap { padding: 16px 16px 120px; }
.form-back {
  background: none; border: none;
  color: var(--tg-theme-button-color, #2481cc);
  font-size: 16px; cursor: pointer; padding: 4px 0; margin-bottom: 16px;
}
.form-title { font-size: 22px; font-weight: 700; margin-bottom: 20px; }
.form-group { margin-bottom: 14px; }
.form-label {
  display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.4px;
  text-transform: uppercase; color: var(--tg-theme-hint-color, #8e8e93); margin-bottom: 6px;
}
input[type="text"], input[type="datetime-local"], input[type="number"], select, textarea {
  padding: 11px 13px; border-radius: 11px; border: none;
  background: var(--tg-theme-secondary-bg-color, #f2f2f7);
  color: var(--tg-theme-text-color, #000); font-size: 15px; outline: none;
  -webkit-appearance: none; appearance: none;
}
input[type="number"] { -moz-appearance: textfield; }
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }

/* Reminders */
.section-title {
  font-size: 13px; font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase;
  color: var(--tg-theme-hint-color, #8e8e93); margin: 20px 0 10px;
}
.rem-block {
  background: var(--tg-theme-secondary-bg-color, #f2f2f7);
  border-radius: 12px; padding: 12px; margin-bottom: 8px;
}
.rem-head {
  display: flex; align-items: center; justify-content: space-between;
  font-weight: 600; font-size: 14px; margin-bottom: 10px;
}
.rem-del-btn {
  background: none; border: none; font-size: 16px; cursor: pointer;
  color: var(--tg-theme-hint-color, #8e8e93); padding: 2px 4px;
}
.rem-row {
  display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap;
}
.rem-row:last-child { margin-bottom: 0; }
.rem-label { font-size: 14px; color: var(--tg-theme-hint-color, #8e8e93); white-space: nowrap; flex-shrink: 0; }
.inp-num { width: 64px; text-align: center; }
.inp-unit { flex: 1; min-width: 72px; }
.add-rem-btn {
  width: 100%; padding: 11px; border-radius: 11px;
  border: 1.5px dashed var(--tg-theme-hint-color, #8e8e93);
  background: none; color: var(--tg-theme-button-color, #2481cc);
  font-size: 14px; cursor: pointer; margin-top: 4px;
}
.repeat-row { display: none; }
.repeat-row.visible { display: flex; }
</style>
</head>
<body>

<div id="view-list" class="view active">
  <div class="list-header">📅 События</div>
  <div class="seg-control">
    <button class="seg-btn active" id="seg-upcoming" onclick="switchTab(false)">Предстоящие</button>
    <button class="seg-btn" id="seg-past" onclick="switchTab(true)">Прошедшие</button>
  </div>
  <div id="events-list"></div>
  <button class="fab" id="btn-new">+</button>
</div>

<div id="view-form" class="view">
  <div class="form-wrap">
    <button class="form-back" id="btn-back">‹ Назад</button>
    <div class="form-title">Новое событие</div>

    <div class="form-group">
      <label class="form-label">Название</label>
      <input type="text" id="f-title" placeholder="Встреча с командой" style="width:100%">
    </div>

    <div class="form-group">
      <label class="form-label">Дата и время</label>
      <input type="datetime-local" id="f-datetime" style="width:100%">
    </div>

    <div class="form-group">
      <label class="form-label">Место</label>
      <input type="text" id="f-location" placeholder="Необязательно" style="width:100%">
    </div>

    <div class="form-group">
      <label class="form-label">Описание</label>
      <textarea id="f-description" placeholder="Необязательно" style="width:100%;min-height:72px;resize:vertical"></textarea>
    </div>

    <div class="section-title">Напоминания</div>
    <div id="reminders-list"></div>
    <button class="add-rem-btn" id="btn-add-rem">+ Добавить напоминание</button>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const initData = tg.initData;
const currentUserId = tg.initDataUnsafe?.user?.id;
const urlParams = new URLSearchParams(window.location.search);
const chatId = urlParams.get('cid')
  ? parseInt(urlParams.get('cid'))
  : (tg.initDataUnsafe?.chat?.id || tg.initDataUnsafe?.user?.id);
const userId = tg.initDataUnsafe?.user?.id;

const BASE = '/' + (window.location.pathname.split('/').filter(Boolean)[0] || 'cal');
const currentUserName = (() => {
  const u = tg.initDataUnsafe?.user;
  if (!u) return null;
  return [u.first_name, u.last_name].filter(Boolean).join(' ');
})();
let remIdSeq = 0;
let editingId = null;
let eventsCache = {};
let showingPast = false;

// ── API ──────────────────────────────────────────────
async function apiFetch(path, opts = {}) {
  const res = await fetch(BASE + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'X-Init-Data': initData, ...(opts.headers||{}) },
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

// ── Utils ────────────────────────────────────────────
function fmtMin(m) {
  if (m >= 1440 && m % 1440 === 0) return `${m/1440} ${plural(m/1440,'день','дня','дней')}`;
  if (m >= 60 && m % 60 === 0) return `${m/60} ${plural(m/60,'час','часа','часов')}`;
  return `${m} мин`;
}
function plural(n, one, two, five) {
  n = Math.abs(n) % 100;
  const n1 = n % 10;
  if (n > 10 && n < 20) return five;
  if (n1 > 1 && n1 < 5) return two;
  if (n1 === 1) return one;
  return five;
}
function fmtDate(isoUtc) {
  const d = new Date(isoUtc + 'Z');
  return d.toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Events list ──────────────────────────────────────
function switchTab(past) {
  showingPast = past;
  document.getElementById('seg-upcoming').classList.toggle('active', !past);
  document.getElementById('seg-past').classList.toggle('active', past);
  document.getElementById('btn-new').style.display = past ? 'none' : 'flex';
  loadEvents();
}

async function loadEvents() {
  const el = document.getElementById('events-list');
  el.innerHTML = '<div class="empty"><div class="empty-icon">⏳</div>Загрузка...</div>';
  try {
    const events = await apiFetch(`/api/events?chat_id=${chatId}&past=${showingPast}`);
    eventsCache = Object.fromEntries(events.map(e => [e.id, e]));
    if (!events.length) {
      const msg = showingPast ? 'Нет прошедших событий' : 'Нет предстоящих событий';
      el.innerHTML = `<div class="empty"><div class="empty-icon">🗓</div>${msg}</div>`;
      return;
    }
    el.innerHTML = events.map(e => {
      const remHtml = (e.reminders || []).map(r => {
        const base = `за ${fmtMin(r.remind_before)}`;
        const rep = r.repeat_count > 1
          ? ` × ${r.repeat_count} (каждые ${fmtMin(r.repeat_interval)})`
          : '';
        return `⏰ ${base}${rep}`;
      }).join('<br>');
      const canDel = !e.created_by || e.created_by === currentUserId;
      return `
        <div class="event-card">
          ${canDel ? `<button class="del-btn" onclick="event.stopPropagation();delEvent(${e.id})">🗑</button>` : ''}
          <div onclick="editEvent(${e.id})" style="cursor:pointer">
            <div class="event-title" style="${canDel ? '' : 'padding-right:0'}">${escHtml(e.title)}</div>
            <div class="event-meta">🕐 ${fmtDate(e.event_time)}</div>
            ${e.location ? `<div class="event-meta">📍 ${escHtml(e.location)}</div>` : ''}
            ${e.description ? `<div class="event-meta" style="margin-top:4px">📝 ${escHtml(e.description)}</div>` : ''}
            ${e.created_by_name ? `<div class="event-meta" style="margin-top:4px">👤 ${escHtml(e.created_by_name)}</div>` : ''}
            ${e.updated_by_name ? `<div class="event-meta">✏️ ${escHtml(e.updated_by_name)}</div>` : ''}
            ${remHtml ? `<div class="event-meta" style="margin-top:6px">${remHtml}</div>` : ''}
          </div>
        </div>`;
    }).join('');
  } catch {
    el.innerHTML = '<div class="empty"><div class="empty-icon">😕</div>Ошибка загрузки</div>';
  }
}

window.delEvent = function(id) {
  tg.showConfirm('Удалить это событие?', async ok => {
    if (!ok) return;
    try { await apiFetch(`/api/events/${id}`, { method: 'DELETE' }); loadEvents(); }
    catch { tg.showAlert('Не удалось удалить'); }
  });
};

function minsToValUnit(m, allowDays = true) {
  if (allowDays && m % 1440 === 0) return { val: m / 1440, unit: 1440 };
  if (m % 60 === 0) return { val: m / 60, unit: 60 };
  return { val: m, unit: 1 };
}

function utcIsoToLocalInput(isoUtc) {
  const d = new Date(isoUtc + 'Z');
  const loc = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return loc.toISOString().slice(0, 16);
}

window.editEvent = function(id) {
  const e = eventsCache[id];
  if (!e) return;
  editingId = id;

  document.getElementById('reminders-list').innerHTML = '';
  remIdSeq = 0;
  (e.reminders || []).forEach(r => {
    const before = minsToValUnit(r.remind_before, true);
    const interval = minsToValUnit(r.repeat_interval || 15, false);
    addReminder({
      beforeVal: before.val, beforeUnit: before.unit,
      repeatCount: r.repeat_count || 1,
      repeatVal: interval.val, repeatUnit: interval.unit,
    });
  });
  if (!e.reminders || !e.reminders.length) addReminder();

  document.getElementById('f-title').value = e.title;
  document.getElementById('f-location').value = e.location || '';
  document.getElementById('f-description').value = e.description || '';
  document.getElementById('f-datetime').value = utcIsoToLocalInput(e.event_time);
  document.querySelector('.form-title').textContent = 'Редактировать событие';

  show('view-form');
  tg.BackButton.show();
  tg.MainButton.setText('Сохранить').show();
  tg.MainButton.onClick(submitEvent);
};

// ── Reminder builder ─────────────────────────────────
function addReminder(defaults = {}) {
  const id = remIdSeq++;
  const div = document.createElement('div');
  div.className = 'rem-block';
  div.id = `rem-${id}`;

  const bv = defaults.beforeVal  ?? 30;
  const bu = defaults.beforeUnit ?? 1;
  const rc = defaults.repeatCount ?? 1;
  const rv = defaults.repeatVal  ?? 15;
  const ru = defaults.repeatUnit ?? 1;

  div.innerHTML = `
    <div class="rem-head">
      <span>⏰ Напоминание</span>
      <button class="rem-del-btn" onclick="removeReminder(${id})">✕</button>
    </div>
    <div class="rem-row">
      <span class="rem-label">За</span>
      <input type="number" class="inp-num rem-before-val" value="${bv}" min="1">
      <select class="inp-unit rem-before-unit">
        <option value="1"  ${bu===1    ?'selected':''}>мин</option>
        <option value="60" ${bu===60   ?'selected':''}>час</option>
        <option value="1440"${bu===1440?'selected':''}>дней</option>
      </select>
    </div>
    <div class="rem-row">
      <span class="rem-label">Повторить</span>
      <input type="number" class="inp-num rem-repeat-count" value="${rc}" min="1" max="20"
             oninput="onRepeatChange(${id})">
      <span class="rem-label">раз</span>
    </div>
    <div class="rem-row repeat-row ${rc > 1 ? 'visible' : ''}" id="rep-row-${id}">
      <span class="rem-label">каждые</span>
      <input type="number" class="inp-num rem-interval-val" value="${rv}" min="1">
      <select class="inp-unit rem-interval-unit">
        <option value="1"  ${ru===1 ?'selected':''}>мин</option>
        <option value="60" ${ru===60?'selected':''}>час</option>
      </select>
    </div>
  `;
  document.getElementById('reminders-list').appendChild(div);
}

window.removeReminder = function(id) {
  const el = document.getElementById(`rem-${id}`);
  if (el) el.remove();
};

window.onRepeatChange = function(id) {
  const block = document.getElementById(`rem-${id}`);
  const cnt = parseInt(block.querySelector('.rem-repeat-count').value) || 1;
  const row = document.getElementById(`rep-row-${id}`);
  row.classList.toggle('visible', cnt > 1);
};

function collectReminders() {
  return Array.from(document.querySelectorAll('.rem-block')).map(block => {
    const bv = parseInt(block.querySelector('.rem-before-val').value) || 1;
    const bu = parseInt(block.querySelector('.rem-before-unit').value);
    const rc = Math.max(1, parseInt(block.querySelector('.rem-repeat-count').value) || 1);
    const rv = parseInt(block.querySelector('.rem-interval-val').value) || 1;
    const ru = parseInt(block.querySelector('.rem-interval-unit').value);
    return {
      remind_before: bv * bu,
      repeat_count: rc,
      repeat_interval: rc > 1 ? rv * ru : 0,
    };
  });
}

// ── Navigation ───────────────────────────────────────
document.getElementById('btn-new').onclick = () => {
  editingId = null;
  document.getElementById('reminders-list').innerHTML = '';
  remIdSeq = 0;
  addReminder({ beforeVal: 30, beforeUnit: 1 });

  document.getElementById('f-title').value = '';
  document.getElementById('f-location').value = '';
  document.getElementById('f-description').value = '';
  document.querySelector('.form-title').textContent = 'Новое событие';
  const d = new Date();
  d.setDate(d.getDate() + 1);
  d.setHours(12, 0, 0, 0);
  const loc = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  document.getElementById('f-datetime').value = loc.toISOString().slice(0, 16);

  show('view-form');
  tg.BackButton.show();
  tg.MainButton.setText('Сохранить').show();
  tg.MainButton.onClick(submitEvent);
};

document.getElementById('btn-add-rem').onclick = () => addReminder();

document.getElementById('btn-back').onclick = goBack;
tg.BackButton.onClick(goBack);

function goBack() {
  show('view-list');
  tg.MainButton.hide();
  tg.MainButton.offClick(submitEvent);
  tg.BackButton.hide();
  loadEvents();
  editingId = null;
}

function show(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ── Submit ───────────────────────────────────────────
async function submitEvent() {
  const title = document.getElementById('f-title').value.trim();
  const dtLocal = document.getElementById('f-datetime').value;
  const location = document.getElementById('f-location').value.trim() || null;
  const description = document.getElementById('f-description').value.trim() || null;
  const reminders = collectReminders();

  if (!title)    { tg.showAlert('Введите название события'); return; }
  if (!dtLocal)  { tg.showAlert('Выберите дату и время'); return; }
  if (!reminders.length) { tg.showAlert('Добавьте хотя бы одно напоминание'); return; }

  const utcStr = new Date(dtLocal).toISOString().slice(0, 16);

  try {
    tg.MainButton.showProgress(false);
    if (editingId) {
      await apiFetch(`/api/events/${editingId}`, {
        method: 'PUT',
        body: JSON.stringify({ title, event_time: utcStr, location, description, reminders }),
      });
    } else {
      await apiFetch('/api/events', {
        method: 'POST',
        body: JSON.stringify({ chat_id: chatId, created_by: userId, created_by_name: currentUserName, title, event_time: utcStr, location, description, reminders }),
      });
    }
    tg.MainButton.hideProgress();
    goBack();
    tg.showAlert('✅ Событие сохранено!');
  } catch(err) {
    tg.MainButton.hideProgress();
    tg.showAlert('Ошибка: ' + err.message);
  }
}

loadEvents();
</script>
</body>
</html>
